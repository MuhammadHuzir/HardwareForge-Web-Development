<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HardwareForge | Login</title>
  <link rel="stylesheet" href="public/css/bootstrap.min.css" />
  <link rel="stylesheet" href="public/css/login.css" />
</head>
<body>

<a href="home.html" class="hf-home d-flex align-items-center text-decoration-none">
  <img src="/public/images/HardwareForge.png" alt="HardwareForge Logo" class="me-3">
  <span class="fw-bold">HardwareForge</span>
</a>

<div class="auth-wrapper">
  <form id="loginForm" class="auth-card">
    <h2 class="auth-title">Welcome back</h2>
    <p class="auth-subtitle">Log in to continue building</p>

    <div class="auth-input">
      <input type="email" id="email" required />
      <span>Email address</span>
    </div>

    <div class="auth-input">
      <input type="password" id="password" required />
      <span>Password</span>
    </div>

    <button type="submit" class="auth-btn">
      <span class="btn-text">Login</span>
      <span class="btn-loader"></span>
    </button>

    <p id="error-message" class="auth-error"></p>

    <p class="auth-footer">
      Don’t have an account?
      <a href="signup.html">Create one</a>
    </p>
  </form>
</div>

<script src="public/js/bootstrap.bundle.min.js"></script>
<script src="public/js/common.js"></script>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const errorMsg = document.getElementById("error-message");

  errorMsg.textContent = "";

  try {
    const res = await fetch("/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (res.ok && data.token && data.user) {
      localStorage.setItem("token", data.token);
      localStorage.setItem("user", JSON.stringify(data.user));

      const role = (data.user.role || "user").toLowerCase();
      window.location.href = role === "admin" ? "/admin.html" : "/home.html";
    } else {
      errorMsg.textContent = data.message || "Invalid credentials.";
    }
  } catch (err) {
    errorMsg.textContent = "Login failed. Please try again.";
  }
});
</script>

</body>
</html>
