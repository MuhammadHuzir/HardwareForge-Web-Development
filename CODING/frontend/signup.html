<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HardwareForge | Sign Up</title>
    <link rel="stylesheet" href="public/css/bootstrap.min.css" />
    <link rel="stylesheet" href="public/css/signup.css" />
</head>
<body>
    <a href="home.html" class="hf-home d-flex align-items-center text-decoration-none">
        <img src="/public/images/HardwareForge.png" alt="HardwareForge Logo" class="me-3">
        <span class="fw-bold">HardwareForge</span>
    </a>
    <div class="auth-wrapper">
        <form id="signupForm" class="auth-card">
            <h2 class="auth-title">Create your account</h2>
            <p class="auth-subtitle">Build smarter with HardwareForge</p>

            <div class="auth-input">
            <input type="text" id="username" required />
            <span>Username</span>
            </div>

            <div class="auth-input">
            <input type="email" id="email" required />
            <span>Email address</span>
            </div>

            <div class="auth-input">
            <input type="password" id="password" required />
            <span>Password</span>
            </div>

            <button type="submit" class="auth-btn">
            <span class="btn-text">Register</span>
            <span class="btn-loader"></span>
            </button>

            <p class="auth-footer">
            Already have an account?
            <a href="login.html">Sign in</a>
            </p>

            <div id="message" class="text-center mt-2"></div>
        </form>
    </div>


  <script>
  document.getElementById('signupForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const messageDiv = document.getElementById('message');
      messageDiv.textContent = '';

      try {
          const res = await fetch('/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ username, email, password }),
          });

          const data = await res.json();

          if (res.ok) {
              messageDiv.textContent = data.message;
              messageDiv.style.color = 'green';
              window.location.href = 'login.html';
          } else {
              messageDiv.textContent = data.message || 'Failed to register.';
              messageDiv.style.color = 'red';
          }
      } catch (error) {
          messageDiv.textContent = 'Error connecting to server.';
          messageDiv.style.color = 'red';
      }
  });
  </script>

  <script src="public/js/bootstrap.bundle.min.js"></script>
  <script src="public/js/common.js"></script>
</body>
</html>
